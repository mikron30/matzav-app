workflows:
  ios-production:
    name: Matzav iOS production
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic matzav
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mikron30.matzav
      vars:
        BUNDLE_ID: com.mikron30.matzav
      flutter: stable
      xcode: latest

    scripts:
      - name: Validate Firebase configuration
        script: |
          test -f ios/Runner/GoogleService-Info.plist
          test -f lib/firebase_options.dart
          /usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/Runner/GoogleService-Info.plist | grep -Fx "$BUNDLE_ID"

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Prepare iOS project
        script: |
          chmod +x scripts/prepare_ios_ci.sh
          ./scripts/prepare_ios_ci.sh

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
